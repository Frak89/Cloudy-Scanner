name: Build APK

on:
  push:
    branches-ignore: [ci-out]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee build.log
      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CloudyScanner-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish build output to ci-out branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/CloudyScanner.apk 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} out/ \; 2>/dev/null || true
          echo "${{ steps.build.outcome }} $GITHUB_SHA $(date -u +%FT%TZ)" > out/status.txt
          cd out
          git init -q
          git checkout -q -b ci-out
          git add -A
          git -c user.name="cloudy-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Build output for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-out
      - name: Fail when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
